<!DOCTYPE html>
<html>
    <head>     
<title> Asthma Predictor </title>
<link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Asthma Predictor </h1>
        <h2> Check your asthma risk</h2>

        <p> Enter your information to ensure your asthma risk</p>

       <button id="predictButton" class="primary-button">Predict Risk</button>

        <label> Age :</label>
        <input type = "number" id="age">

    <label> gender:</label>
        <select id="gender">
            <option> male</option>
            <option> female</option>
        </select>

    <label> difficulty in breathing:</label>
      <select id="breathing">
        <option> none</option>
        <option> low</option>
        <option> mid</option>
        <option> high</option>
      </select>

    <label>Dry Cough:</label>

        <select id="dryCough">
            <option>None</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
    </select>

    <label>Runny Nose:</label>
<select id="runnyNose">
    <option>None</option>
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
</select>

<label>Nasal Congestion:</label>
<select id="nasalCongestion">
    <option>None</option>
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
</select>

<script src="script.js"></script>
    </body>

</html>
